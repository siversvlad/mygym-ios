name: MyGym
options:
  bundleIdPrefix: ru.sivers
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  MyGym:
    type: application
    platform: iOS
    sources:
      - path: MyGym
        excludes: ["Info.plist"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MyGym/Info.plist
      properties:
        CFBundleDisplayName: MyGym
        NSBluetoothAlwaysUsageDescription: "MyGym использует Bluetooth для подключения пульсометра и расчёта калорий после тренировки."
        CFBundleShortVersionString: '6.20'
        CFBundleVersion: '6'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
