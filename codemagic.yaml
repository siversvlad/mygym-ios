workflows:
  ios-check:
    name: MyGym iOS — проверка сборки
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Установить XcodeGen
        script: |
          brew install xcodegen
      - name: Сгенерировать Xcode-проект
        script: |
          xcodegen generate
      - name: Собрать для симулятора без подписи
        script: |
          xcodebuild -project MyGym.xcodeproj -scheme MyGym -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-device-ipa:
    name: MyGym iOS — IPA для AltStore
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Установить XcodeGen
        script: |
          brew install xcodegen
      - name: Сгенерировать Xcode-проект
        script: |
          xcodegen generate
      - name: Собрать для iPhone без подписи
        script: |
          set -e
          xcodebuild -project MyGym.xcodeproj -scheme MyGym -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$CM_BUILD_DIR/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Проверить собранное приложение
        script: |
            APP="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/MyGym.app"
            {
              echo "=== Info.plist ==="
              plutil -p "$APP/Info.plist"
              echo "=== Executable ==="
              file "$APP/MyGym"
              echo "=== App files ==="
              ls -la "$APP"
            } > /tmp/ipa-check.txt 2>&1     
      - name: Упаковать неподписанный IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/MyGym.app" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qr "$CM_BUILD_DIR/MyGym-unsigned.ipa" Payload
    artifacts:
      - MyGym-unsigned.ipa
      - /tmp/ipa-check.txt
      - /tmp/xcodebuild_logs/*.log
